name: Sync Upstream

on:
  # 1. 定时自动触发：每天 UTC 时间 0 点（北京时间 8 点）执行一次
  schedule:
    - cron: '0 0 * * *'
  # 2. 手动触发：允许在网页端 Actions 页面点击按钮立即执行
  workflow_dispatch:

# 赋予工作流写入仓库代码的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 必须获取完整历史记录，否则无法与上游合并
          fetch-depth: 0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 替代默认 token，这样推送的 commit/tag 才能触发其他 Actions
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync with upstream & trigger release
        env:
          UPSTREAM_URL: https://github.com/N3urda/hongguoTV.git
          BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream "$UPSTREAM_URL"
          # 连同上游的 tags 一起拉取
          git fetch upstream --tags
          git checkout "$BRANCH"
          git merge "upstream/$BRANCH" --no-edit
          
          # 推送代码和新增的 tags（新 tag 会直接触发原有的 Release 工作流）
          git push origin "$BRANCH"
          git push origin --tags
