name: Build Custom APK

on:
  push:
    branches: [ my-custom ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Ensure deterministic debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build Debug APK
        run: |
          chmod +x ./kotlin-tv/gradlew
          ./kotlin-tv/gradlew -p kotlin-tv :app:assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-custom-apk
          path: kotlin-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 30

